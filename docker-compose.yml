# MOUORA AI — produção: Postgres + Next.js + Cloudflare Tunnel.
# Só o túnel fala com a internet; o banco fica numa rede interna (sem saída nem portas publicadas).
# Subir:   docker compose -f docker-compose.yml up -d --build        (produção: ignora o override de desenvolvimento)
# Dev:     docker compose up -d db                                    (aplica docker-compose.override.yml: banco em 127.0.0.1:5433)

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    container_name: mouora-db
    # o Postgres precisa destas capacidades só para ajustar permissões do volume na primeira subida
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mouora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-mouora}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "password_encryption=scram-sha-256", "-c", "log_min_duration_statement=1000"]
    volumes:
      - mouora_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [backend]
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    <<: *hardening
    build: .
    image: mouora-app:latest
    container_name: mouora-app
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mouora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mouora}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      SITE_URL: ${SITE_URL:-https://mouora.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    networks: [backend, edge]
    mem_limit: 768m
    pids_limit: 256
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    container_name: mouora-cloudflared
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app: { condition: service_healthy }
    read_only: true
    networks: [edge]
    mem_limit: 256m
    pids_limit: 100

networks:
  # sem saída para a internet e sem portas publicadas: só o app alcança o banco
  backend:
    internal: true
  edge: {}

volumes:
  mouora_pgdata:
    name: mimix-clone_mouora_pgdata

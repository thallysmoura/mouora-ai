services:
  db:
    image: postgres:17-alpine
    container_name: mouora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mouora
      POSTGRES_PASSWORD: mouora_dev_pw
      POSTGRES_DB: mouora
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mouora_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouora"]
      interval: 5s
      retries: 10
volumes:
  mouora_pgdata:
